services:
  - type: web
    name: lifeos-app
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,127.0.0.1,localhost"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString

databases:
  - name: lifeos-db
    databaseName: lifeos_db
    user: lifeos_user
    plan: standard
