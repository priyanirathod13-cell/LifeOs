{% extends "base.html" %}
{% load static %}

{% block title %}400 — Bad Request | LifeOS{% endblock %}

{% block body %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); padding: 1.5rem;">
    <div style="max-width: 520px; width: 100%; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 3rem 2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);">
        <div style="font-size: 5rem; font-weight: 800; color: var(--danger); line-height: 1; margin-bottom: 1rem; letter-spacing: -2px;">
            400
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.75rem;">
            Invalid Request Payload
        </h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
            The request sent to the server was malformed or failed integrity checks.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'core:dashboard' %}" class="btn btn-primary" style="padding: 0.65rem 1.25rem; font-weight: 600;">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
