{% load static %}
<div class="analytics-header-nav" style="margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
    <!-- Sub-navigation Tabs -->
    <div class="tabs-container" style="display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem;">
        <a href="{% url 'analytics:dashboard' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'overview' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <rect x="3" y="3" width="7" height="9"></rect>
                <rect x="14" y="3" width="7" height="5"></rect>
                <rect x="14" y="12" width="7" height="9"></rect>
                <rect x="3" y="16" width="7" height="5"></rect>
            </svg>
            Overview
        </a>
        <a href="{% url 'analytics:productivity' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'productivity' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            Productivity
        </a>
        <a href="{% url 'analytics:study' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'study' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
            Study
        </a>
        <a href="{% url 'analytics:habits' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'habits' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Habits
        </a>
        <a href="{% url 'analytics:time' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'time' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Time
        </a>
        <a href="{% url 'analytics:wellbeing' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'wellbeing' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            Well-being
        </a>
        <a href="{% url 'analytics:insights' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'insights' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
            </svg>
            Insights
        </a>
        <a href="{% url 'analytics:compare' %}{% if request.GET.range %}?range={{ request.GET.range }}{% endif %}" class="btn btn-sm {% if analytics_tab == 'compare' %}btn-primary{% else %}btn-outline{% endif %}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <polyline points="16 3 21 3 21 8"></polyline>
                <line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline>
            </svg>
            Compare
        </a>
    </div>

    <!-- Date Range Filter Pills -->
    <div class="date-filter-group" style="display: flex; align-items: center; gap: 0.35rem; background: var(--bg-card); padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border);">
        <span style="font-size: 0.75rem; color: var(--text-muted); margin-right: 4px; padding-left: 4px;">Period:</span>
        <a href="?range=7d" class="btn btn-xs {% if dt_info.preset == '7d' %}btn-primary{% else %}btn-ghost{% endif %}" style="padding: 2px 8px; font-size: 0.75rem;">7d</a>
        <a href="?range=30d" class="btn btn-xs {% if dt_info.preset == '30d' %}btn-primary{% else %}btn-ghost{% endif %}" style="padding: 2px 8px; font-size: 0.75rem;">30d</a>
        <a href="?range=90d" class="btn btn-xs {% if dt_info.preset == '90d' %}btn-primary{% else %}btn-ghost{% endif %}" style="padding: 2px 8px; font-size: 0.75rem;">90d</a>
        <a href="?range=this_week" class="btn btn-xs {% if dt_info.preset == 'this_week' %}btn-primary{% else %}btn-ghost{% endif %}" style="padding: 2px 8px; font-size: 0.75rem;">Week</a>
        <a href="?range=this_month" class="btn btn-xs {% if dt_info.preset == 'this_month' %}btn-primary{% else %}btn-ghost{% endif %}" style="padding: 2px 8px; font-size: 0.75rem;">Month</a>
    </div>
</div>
