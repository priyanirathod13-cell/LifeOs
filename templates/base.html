{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="LifeOS — Multi-user Personal Behavioral Intelligence and Life Management System">
    <meta name="theme-color" content="#0F1117">

    <title>{% block title %}LifeOS — Personal Behavioral Intelligence{% endblock %}</title>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- LifeOS Design System CSS Modules -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <!-- Core Interactions & Navigation Scripts -->
    <script src="{% static 'js/navigation.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
