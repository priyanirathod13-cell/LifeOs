{% load static %}
<header class="header" id="header">
    <div class="header-left">
        <!-- Mobile Navigation Menu Toggle -->
        <button class="header-menu-btn" id="mobileMenuBtn" aria-label="Open Navigation Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Breadcrumbs / Page Context -->
        <nav class="header-breadcrumbs" aria-label="Breadcrumb">
            <span class="breadcrumb-item">LifeOS</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">{% block header_breadcrumb %}{{ page_title|default:"Dashboard" }}{% endblock %}</span>
        </nav>
    </div>

    <div class="header-right">
        <!-- System Status Indicator -->
        <div class="status-pill" title="Timezone and System State">
            <span class="status-dot"></span>
            <span>Asia/Kolkata</span>
        </div>

        <!-- Notification Trigger Placeholder -->
        <button class="header-action-btn" aria-label="Notifications" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge"></span>
        </button>

        <!-- User Profile Dropdown Menu -->
        <div class="user-profile-menu">
            <button class="user-profile-btn" data-dropdown-toggle="userDropdownMenu" aria-expanded="false" aria-label="User Profile Menu">
                <img src="{% static 'images/avatar-placeholder.svg' %}" alt="User Avatar" class="user-avatar-img">
                <div class="user-info">
                    <span class="user-name">{{ request.user.username|default:"Priyani" }}</span>
                    <span class="user-role">Architect</span>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted);">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>

            <!-- Dropdown Body -->
            <div class="dropdown-menu" id="userDropdownMenu" role="menu">
                <div class="dropdown-header">
                    <div class="dropdown-header-name">{{ request.user.get_full_name|default:"Priyani Rathod" }}</div>
                    <div class="dropdown-header-email">{{ request.user.email|default:"architect@lifeos.internal" }}</div>
                </div>
                <a href="{% url 'core:settings' %}" class="dropdown-item" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>My Profile</span>
                </a>
                <a href="{% url 'core:settings' %}" class="dropdown-item" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>System Settings</span>
                </a>
                <a href="{% url 'core:ui_system' %}" class="dropdown-item" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>UI Design Showcase</span>
                </a>
                <div class="dropdown-divider"></div>
                <a href="#" class="dropdown-item text-danger" role="menuitem" onclick="alert('Authentication workflows will be implemented in a subsequent milestone.'); return false;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sign Out</span>
                </a>
            </div>
        </div>
    </div>
</header>
