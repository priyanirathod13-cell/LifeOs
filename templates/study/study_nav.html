<!-- Study Module Section Navigation -->
<div class="card" style="padding: var(--space-2) var(--space-3); background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-bottom: var(--space-6); overflow-x: auto; white-space: nowrap;">
    <div style="display: flex; gap: var(--space-2); align-items: center;">
        <a href="{% url 'study:dashboard' %}" class="btn {% if study_subnav == 'dashboard' or not study_subnav %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
            Dashboard
        </a>
        <a href="{% url 'study:subject_list' %}" class="btn {% if study_subnav == 'subjects' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            Subjects
        </a>
        <a href="{% url 'study:topic_list' %}" class="btn {% if study_subnav == 'topics' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Topics
        </a>
        <a href="{% url 'study:syllabus' %}" class="btn {% if study_subnav == 'syllabus' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
            </svg>
            Syllabus Tracker
        </a>
        <a href="{% url 'study:planner' %}" class="btn {% if study_subnav == 'planner' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Planner
        </a>
        <a href="{% url 'study:sessions' %}" class="btn {% if study_subnav == 'sessions' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Sessions & Timer
        </a>
        <a href="{% url 'study:revisions' %}" class="btn {% if study_subnav == 'revisions' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            Revisions
        </a>
        <a href="{% url 'study:exams' %}" class="btn {% if study_subnav == 'exams' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            Exams
        </a>
        <a href="{% url 'study:analytics' %}" class="btn {% if study_subnav == 'analytics' %}btn-primary{% else %}btn-ghost{% endif %} btn-sm" style="font-size: var(--font-size-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            Analytics
        </a>
    </div>
</div>
